  {n:"陰の火",t:"灯火",tr:"強い集中力と直感の持ち主。温かさはやわらかいけれど、頭の中は他の人が見逃す細部まで燃やし尽くします。",lv:"心を開くまでは時間がかかるものの、開いたら一途。深く静かなつながりを望みます。",wk:"研究、執筆、癒やしの仕事、職人的な極め。"},
  {n:"陽の土",t:"山",tr:"どっしり安定して信頼できる人。いざという時に動じないので、みんなが悩みを持ち込みます。",lv:"ゆっくり燃えて、しっかり続く愛。そばにいることで愛を示します。",wk:"マネジメント、不動産、運営。安定した軸が必要な場所。"},
  {n:"陰の土",t:"庭",tr:"世話好きで現実的、静かに賢い人。庭が命を育てるように、忍耐と愛情で人を育てます。",lv:"思いやり深く誠実。相手の大切な小さなことを全部覚えています。",wk:"教育、ケア、企画、プロダクト、コミュニティ運営。"},
  {n:"陽の金",t:"剣",tr:"率直で決断が早く、とことん公平。混乱を断ち切り、他の人が避けることをはっきり言います。正直さが武器です。",lv:"全力で誠実、基準は高め。甘い言葉より本当のことを選びます。",wk:"法律、エンジニア、金融、危機時のリーダー。"},
  {n:"陰の金",t:"宝石",tr:"洗練されていて観察眼が鋭く、プレッシャーの中でこそ輝く人。質の良さを一目で見抜き、自分にも高い基準を課します。",lv:"選び抜く上品な愛。あなたの奥深さを理解してくれる人を求めます。",wk:"ブランド、美容、分析、細部が命の分野。"},
  {n:"陽の水",t:"大海",tr:"心が広く自由で、好奇心が尽きない人。アイデアの潮流に乗り、全体の地図を見渡します。",lv:"冒険好きでオープン。自由な空間と、一緒に探検してくれる人が必要です。",wk:"貿易、旅、戦略、テクノロジー。グローバルな仕事。"},
  {n:"陰の水",t:"雨",tr:"やさしく洞察力が高く、想像力豊か。他の人が気づかない気持ちや意味を感じ取ります。",lv:"繊細で情の深い愛。静かで正直な会話で絆を深めます。",wk:"アート、カウンセリング、執筆、直感を活かす仕事。"}
 ],

  heaven:{t:"天の縁（干合）",x:"サジュでは古典的な「干合」の組み合わせ。2人の日主が自然に引き合います。珍しく、磁石のようで、一緒に成長できる関係です。"},
  mirror:{t:"鏡の関係",x:"同じ五行なので、すぐに分かり合えます。ただし、同じ死角も持っているのが課題です。"},
  nourish:{t:"あなたが育てる",x:"あなたのエネルギーが相手を育てます。成長を後押しする支えと火花を与える存在。あなた自身も大切にされるよう気をつけて。"},
  nourished:{t:"相手が育ててくれる",x:"相手のエネルギーがあなたを育てます。一緒にいると支えられ、本来の自分に近づける、とても居心地のよい組み合わせです。"},
  challenge:{t:"あなたが刺激する",x:"あなたのエネルギーが相手を押します。刺激的で緊張感もあり、火花が散る時に互いに優しくいられればうまくいきます。"},
  challenged:{t:"相手が刺激する",x:"相手のエネルギーがあなたを試します。コンフォートゾーンの外へ連れ出されますが、お互いの忍耐で成長できます。"}

  {n:"陽木",t:"大樹",tr:"正直、有野心，天生的領導者。你筆直地朝目標生長，旁人都依靠你的力量，但你不愛彎腰，即使彎一下才是聰明的選擇。",lv:"忠誠而保護欲強。你會愛上讓你照自己方式成長的人。",wk:"創業者、領導者、建設者。擁有自己的願景時最耀眼。"},

  {n:"陽火",t:"太陽",tr:"溫暖、大膽，讓人無法忽視。你照亮整個空間，樂於分享功勞，挫折後也恢復得很快。",lv:"慷慨又熱情。你需要能欣賞你光芒的伴侶。",wk:"舞台、銷售、教學與面向大眾的領導角色。"},
  {n:"陰火",t:"燭光",tr:"強烈、直覺敏銳又極度專注。你的溫暖很柔和，但你的腦袋會把別人漏掉的細節燃燒殆盡。",lv:"慢熱，一旦敞開心扉便全心投入。你渴望深刻而私密的連結。",wk:"研究、寫作、療癒工作與匠人精神。"},
  {n:"陽土",t:"高山",tr:"穩重可靠，關鍵時刻紋風不動。大家把煩惱交給你，因為你從不慌張。",lv:"慢慢燃燒、承諾牢固。你用陪伴來表達愛。",wk:"管理、不動產、營運。任何需要穩定支柱的地方。"},
  {n:"陰土",t:"花園",tr:"體貼、務實，默默有智慧。你像花園孕育生命一樣培育他人：有耐心，也很用心。",lv:"關懷又忠誠。你記得對方在乎的每一件小事。",wk:"教育、照護、規劃、產品與社群經營。"},
  {n:"陽金",t:"利劍",tr:"直接、果斷，極度公正。你能斬斷混亂，說出別人不敢說的話。你的誠實就是你的鋒芒。",lv:"全心忠誠、標準很高。比起甜言蜜語，你更重視真話。",wk:"法律、工程、金融與危機中的領導。"},

const $=id=>document.getElementById(id);
const LANGS=["en","ja","zh","es","fr"];
let lang="en", current=null, lastMatch=null;
const T=()=>I18N[lang];
const esc=s=>String(s).replace(/[<>&"]/g,"");

function detect(){
  try{
    const q=new URLSearchParams(location.search).get("lang");
    if(q && LANGS.includes(q)) return q;
  }catch(e){}
  try{
    const s=localStorage.getItem("sajupia_lang");
    if(s && LANGS.includes(s)) return s;
  }catch(e){}
  const n=(navigator.language||"en").toLowerCase();
  if(n.startsWith("ja")) return "ja";
  if(n.startsWith("es")) return "es";
  if(n.startsWith("fr")) return "fr";
  if(n.startsWith("zh") && /(tw|hk|mo|hant)/.test(n)) return "zh";
  return "en";
}
function applyStatic(){
  const t=T();
  document.documentElement.lang = lang==="zh" ? "zh-Hant" : lang;
  document.title=t.docTitle;
  document.querySelectorAll("[data-k]").forEach(el=>{ el.innerHTML=t[el.getAttribute("data-k")]; });
  $("name").placeholder=t.namePh;
  document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c.getAttribute("data-lang")===lang));
}
function setLang(l){
  lang=l;
  try{localStorage.setItem("sajupia_lang",l);}catch(e){}
  applyStatic();
  if(current) paintResult();
  if(lastMatch) paintMatch();
}
function parseDate(v){
  if(!v) return null;
  const p=v.split("-").map(Number);
  if(p.length!==3||p.some(isNaN)) return null;
  const [y,m,d]=p;
  if(y<1900||y>2100) return null;
  return {y,m,d};
}
function paintResult(){
  const t=T(), c=current, P=c.P;
  const S=t.stems[P.dayStem], sm=STEM_META[P.dayStem];
  const elName=t.el[sm.e], col=EL_COLOR[sm.e];
  const nm=c.nm;
  const card=$("resCard");
  card.style.background="linear-gradient(160deg,"+col+",#111111)";
  card.innerHTML=
    '<div class="tag">'+t.tag+'</div>'+
    '<div class="big">'+sm.h+BR_META[P.dayBranch].h+'</div>'+
    '<h2>'+t.you(nm)+'<span class="nowrap">'+S.n+t.youSuf+'</span></h2>'+
    '<div class="sub">'+S.t+'</div>'+
    '<span class="pill">'+t.pillEl(elName)+'</span>'+
    '<span class="pill">'+t.pillYear(STEM_META[P.yearStem].e,P.yearBranch)+'</span>';

  const cnt=[0,0,0,0,0];
  cnt[STEM_META[P.yearStem].e]++; cnt[BR_META[P.yearBranch].e]++; cnt[sm.e]++; cnt[BR_META[P.dayBranch].e]++;
  $("bars").innerHTML=t.el.map((n,i)=>
    '<div class="bar"><span style="color:'+EL_COLOR[i]+'">'+n+'</span><div class="track"><div class="fill" style="width:'+(cnt[i]/4*100)+'%;background:'+EL_COLOR[i]+'"></div></div><span>'+cnt[i]+'</span></div>'
  ).join("");
  const miss=t.el.filter((n,i)=>cnt[i]===0);
  $("missing").innerHTML = miss.length ? t.missing(miss.join(t.joiner)) : t.full;

  $("readTitle").textContent=t.readTitle(nm);
  $("rTrait").textContent=S.tr;
  $("rLove").textContent=S.lv;
  $("rWork").textContent=S.wk;
}
function reveal(){
  const dt=parseDate($("dob").value);
  if(!dt){ alert(T().needDob); return; }
  current={P:pillars(dt.y,dt.m,dt.d),nm:esc(($("name").value||"").trim())};
  lastMatch=null;
  paintResult();
  $("matchOut").classList.add("hidden");
  $("formArea").classList.add("hidden");
  $("resultArea").classList.remove("hidden");
  $("resCard").scrollIntoView({behavior:"smooth",block:"start"});
}
function paintMatch(){
  const t=T(), r=lastMatch;
  $("mScore").textContent=r.score+"%";
  $("mMeter").style.width=r.score+"%";
  $("mTitle").innerHTML='<b>'+t.cmp[r.key].t+'</b><br>'+t.youL+': '+t.stems[current.P.dayStem].n+' · '+t.themL+': '+t.stems[r.stem].n;
  $("mText").textContent=t.cmp[r.key].x;
  $("matchOut").classList.remove("hidden");
}
function match(){
  const dt=parseDate($("dob2").value);
  if(!dt){ alert(T().needDob2); return; }
  const P2=pillars(dt.y,dt.m,dt.d);
  const r=compat(current.P.dayStem,P2.dayStem);
  lastMatch={score:r.score,key:r.key,stem:P2.dayStem};
  paintMatch();
}
function fit(x,txt,weight,px,maxW){
  let s=px;
  do{ x.font=weight+" "+s+"px sans-serif"; s-=2; }while(x.measureText(txt).width>maxW && s>20);
}
function drawCard(){
  const t=T(), P=current.P, sm=STEM_META[P.dayStem], S=t.stems[P.dayStem];
  const W=1080,H=1350,c=document.createElement("canvas");c.width=W;c.height=H;
  const x=c.getContext("2d");
  const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,EL_COLOR[sm.e]);g.addColorStop(1,"#111111");
  x.fillStyle=g;x.fillRect(0,0,W,H);
  x.textAlign="center";x.fillStyle="#FFFFFF";
  x.font="900 44px sans-serif";x.fillText("SAJUPIA · K-SAJU",W/2,120);
  fit(x,t.cardTop,"900",70,960);x.fillText(t.cardTop,W/2,290);
  x.font="900 300px sans-serif";x.fillText(sm.h+BR_META[P.dayBranch].h,W/2,620);
  fit(x,S.n,"900",92,960);x.fillText(S.n,W/2,780);
  fit(x,S.t,"800",66,960);x.fillText(S.t,W/2,880);
  x.fillRect(240,950,600,8);
  const l1=t.pillEl(t.el[sm.e]), l2=t.pillYear(STEM_META[P.yearStem].e,P.yearBranch);
  fit(x,l1,"800",54,960);x.fillText(l1,W/2,1045);
  fit(x,l2,"800",54,960);x.fillText(l2,W/2,1125);
  x.fillStyle="#F59E0B";
  fit(x,t.cardFoot,"900",52,960);x.fillText(t.cardFoot,W/2,1250);
  return c;
}
async function share(){
  const t=T(), msg=$("shareMsg"), sm=STEM_META[current.P.dayStem];
  const text=t.shareText(t.stems[current.P.dayStem].n,t.stems[current.P.dayStem].t,t.el[sm.e]);
  let url=location.href.split("#")[0];
  try{ const u=new URL(location.href); u.hash=""; u.searchParams.set("lang",lang); url=u.toString(); }catch(e){}
  const blob=await new Promise(r=>drawCard().toBlob(r,"image/png"));
  try{
    const f=blob?new File([blob],"sajupia.png",{type:"image/png"}):null;
    if(f && navigator.canShare && navigator.canShare({files:[f]})){
      await navigator.share({files:[f],text:text+" "+url}); return;
    }
    if(navigator.share){ await navigator.share({text:text,url:url}); return; }
  }catch(e){ if(e&&e.name==="AbortError") return; }
  try{ await navigator.clipboard.writeText(text+" "+url); msg.textContent=t.copied; }
  catch(e){ msg.textContent=t.copyFail; }
  msg.classList.remove("hidden");
}
document.querySelectorAll(".chip").forEach(b=>b.addEventListener("click",()=>setLang(b.getAttribute("data-lang"))));
$("goBtn").addEventListener("click",reveal);
$("matchBtn").addEventListener("click",match);
$("shareBtn").addEventListener("click",share);
$("againBtn").addEventListener("click",()=>{
  current=null;lastMatch=null;
  $("resultArea").classList.add("hidden");$("formArea").classList.remove("hidden");
  $("dob").value="";$("dob2").value="";window.scrollTo({top:0,behavior:"smooth"});
});
setLang(detect());
</script>
