:root{--ink:#111111}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;font-family:"SajuLatin","Noto Sans KR","Noto Sans CJK KR","Noto Sans JP","Noto Sans TC",sans-serif;
  color:var(--ink);background:#FFF1F8;font-size:17px;line-height:1.85;font-weight:600;
}
.wrap{max-width:520px;margin:0 auto;padding:0 0 28px}
.hero{background:linear-gradient(160deg,#7C3AED 0%,#DB2777 60%,#F59E0B 100%);color:#fff;padding:30px 20px 28px;text-align:center}
html[lang="ko"] body{word-break:keep-all;overflow-wrap:break-word}
html[lang="ko"] body,html[lang="ko"] button,html[lang="ko"] input{font-family:"SajuLatin","Noto Sans KR","Noto Sans CJK KR",sans-serif}
html[lang="ja"] body,html[lang="ja"] button,html[lang="ja"] input{font-family:"SajuLatin","Noto Sans JP","Noto Sans CJK JP","Noto Sans KR",sans-serif}
html[lang="zh-Hant"] body,html[lang="zh-Hant"] button,html[lang="zh-Hant"] input{font-family:"SajuLatin","Noto Sans TC","Noto Sans CJK TC","Noto Sans KR",sans-serif}
button,input{font-family:inherit}
.shout{display:block;margin:0 auto 18px;max-width:340px;background:#FACC15;color:#111;border:3px solid #111;border-radius:18px;padding:10px 14px;font-size:22px;line-height:1.5;font-weight:900;text-wrap:balance}
.shout .ask{display:block;margin-top:2px;font-size:24px;color:#B91C1C}
.brand{font-size:15px;letter-spacing:.2em;font-weight:900;white-space:nowrap}
.langs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px auto 0;max-width:340px}
.chip{width:100%;margin:0;padding:6px 6px;font-size:16px;line-height:1.6;border-radius:999px;border:2px solid #fff;background:rgba(0,0,0,.18);color:#fff;font-weight:900;white-space:nowrap;cursor:pointer;font-family:inherit}
.chip.on{background:#fff;color:#111}
.hero h1{margin:16px 0 10px;font-size:32px;line-height:1.35;font-weight:900;text-wrap:balance}
.hero p{margin:0;font-size:18px;line-height:1.8;font-weight:700;text-wrap:balance}
.kw{margin-top:12px;font-size:16px;line-height:1.8;font-weight:800;letter-spacing:.02em}
.hanja{font-size:46px;letter-spacing:.18em;font-weight:900;margin:16px 0 0;white-space:nowrap}
.card{margin:16px 14px 0;border-radius:22px;padding:22px 20px;background:#fff;border:3px solid #111}
.card h2{margin:0 0 12px;font-size:23px;line-height:1.45;font-weight:900;text-wrap:balance}
label{display:block;font-size:18px;font-weight:900;margin:14px 0 6px;text-wrap:balance}
input[type=date],input[type=text]{width:100%;font:inherit;font-weight:800;font-size:19px;padding:14px;border:3px solid #111;border-radius:14px;background:#FEF3C7;color:#111}
input:focus{outline:4px solid #DB2777}
button.act{font:inherit;font-weight:900;cursor:pointer;border:3px solid #111;border-radius:16px;padding:16px 18px;width:100%;font-size:20px;color:#fff;line-height:1.5}
.btn-main{background:linear-gradient(90deg,#DC2626,#DB2777);margin-top:20px}
.btn-share{background:#15803D;margin-top:14px}
.btn-alt{background:#7C3AED;margin-top:14px}
.steps{display:grid;gap:12px;margin:16px 14px 0}
.step{border-radius:22px;padding:0;overflow:hidden;color:#fff;border:3px solid #111;font-size:18px;font-weight:800;line-height:1.7}
.step svg{display:block;width:100%;height:auto;background:rgba(0,0,0,.16);border-bottom:3px solid #111}
.step .pt{padding:12px 18px 16px}
.step b{font-size:22px;font-weight:900;display:block;line-height:1.5}
.step span{display:block;text-wrap:balance}
.apps{margin:22px 14px 0;display:grid;gap:14px}
.apps h2{margin:0;font-size:22px;line-height:1.5;font-weight:900;text-align:center;text-wrap:balance}
a.poster{display:block;border:3px solid #111;border-radius:22px;overflow:hidden;color:#fff;text-decoration:none;cursor:pointer}
a.poster svg{display:block;width:100%;height:auto;border-bottom:3px solid #111}
a.poster .pt{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 16px 16px}
a.poster b{display:block;font-size:24px;font-weight:900;line-height:1.5;white-space:nowrap}
a.poster small{display:block;font-size:16px;font-weight:800;line-height:1.65;text-wrap:balance}
a.tlink{display:block;border:3px solid #111;border-radius:22px;padding:18px 16px;text-align:center;color:#fff;text-decoration:none;cursor:pointer;background:linear-gradient(160deg,#7C3AED,#B91C1C)}
a.tlink .fu{display:inline-block;background:#B91C1C;color:#FACC15;border:3px solid #FACC15;font-size:34px;font-weight:900;line-height:1;padding:8px 10px;margin-bottom:10px}
a.tlink b{display:block;font-size:22px;font-weight:900;line-height:1.7}
a.tlink b span{display:block;text-wrap:balance;word-break:keep-all}
a.tlink .go{display:inline-block;margin-top:12px;background:#FACC15;color:#111;border:3px solid #111;border-radius:999px;padding:10px 20px;font-size:18px;font-weight:900;white-space:nowrap}
a.poster .go{background:#FACC15;color:#111;border:3px solid #111;border-radius:999px;padding:8px 14px;font-size:17px;font-weight:900;white-space:nowrap}
.po-m{background:linear-gradient(160deg,#B91C1C,#F59E0B)}
.po-g{background:linear-gradient(160deg,#7C3AED,#B91C1C)}
.s1{background:#15803D}.s2{background:#D97706}.s3{background:#1D4ED8}
.hidden{display:none}
.result-card{margin:16px 14px 0;border-radius:24px;padding:26px 20px;color:#fff;text-align:center;border:3px solid #111}
.result-card .big{font-size:84px;line-height:1.2;font-weight:900;white-space:nowrap}
.result-card .tag{font-size:15px;letter-spacing:.12em;font-weight:900;text-wrap:balance}
.result-card h2{margin:8px 0 4px;font-size:30px;line-height:1.35;font-weight:900;text-wrap:balance}
.result-card .sub{font-size:19px;font-weight:800;line-height:1.7;text-wrap:balance}
.pill{display:inline-block;background:#fff;color:#111;border-radius:999px;padding:6px 16px;font-size:17px;font-weight:900;margin:12px 4px 0;border:2px solid #111;max-width:100%}
.bars{display:grid;gap:12px;margin-top:6px}
.bar{display:grid;grid-template-columns:78px 1fr 30px;align-items:center;gap:10px;font-size:17px;font-weight:900}
.bar .track{height:20px;border-radius:999px;background:#E5E7EB;border:2px solid #111;overflow:hidden}
.bar .fill{height:100%;border-radius:999px}
.tip{border-radius:16px;padding:14px 16px;margin-top:14px;font-size:18px;font-weight:800;line-height:1.75;background:#FEF3C7;border:3px solid #111}
.read{border-radius:18px;padding:16px 18px;margin-top:12px;border:3px solid #111;color:#fff;font-size:18px;line-height:1.85;font-weight:700}
.read b{display:block;font-size:20px;font-weight:900;margin-bottom:2px}
.r-trait{background:#7C3AED}.r-love{background:#DB2777}.r-work{background:#1D4ED8}
.score{font-size:64px;line-height:1.2;font-weight:900;text-align:center;margin:6px 0 0}
.meter{height:24px;border-radius:999px;border:3px solid #111;background:#E5E7EB;overflow:hidden;margin:6px 0 12px}
.meter div{height:100%;background:linear-gradient(90deg,#DC2626,#DB2777,#7C3AED)}
.lock{margin:16px 14px 0;border-radius:24px;border:3px solid #111;background:linear-gradient(160deg,#111,#7C3AED);color:#fff;padding:22px 20px}
.lock h2{margin:0 0 10px;font-size:24px;line-height:1.45;font-weight:900;text-wrap:balance}
.lock ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.lock li{display:grid;grid-template-columns:34px 1fr;gap:6px;font-size:18px;font-weight:800;line-height:1.7}
.soon{margin-top:16px;background:#F59E0B;color:#111;border:3px solid #fff;border-radius:16px;padding:14px;text-align:center;font-size:19px;font-weight:900;text-wrap:balance}
.foot{margin:18px 14px 0;text-align:center;font-size:15px;font-weight:800;line-height:1.8}
.foot div{text-wrap:balance}
.nowrap{white-space:nowrap}

select{width:100%;font:inherit;font-weight:800;font-size:19px;padding:14px;border:3px solid #111;border-radius:14px;background:#FEF3C7;color:#111}
html[lang="ko"] select{font-family:"SajuLatin","Noto Sans KR","Noto Sans CJK KR",sans-serif}
html[lang="ja"] select{font-family:"SajuLatin","Noto Sans JP","Noto Sans CJK JP","Noto Sans KR",sans-serif}
html[lang="zh-Hant"] select{font-family:"SajuLatin","Noto Sans TC","Noto Sans CJK TC","Noto Sans KR",sans-serif}
select:focus{outline:4px solid #DB2777}
.deep{background:#fff}
.deep h2{background:linear-gradient(90deg,#7C3AED,#DB2777);color:#fff;margin:-22px -20px 14px;padding:16px 20px;border-radius:19px 19px 0 0}
.dp-sec{margin-top:22px}
.dp-h{color:#fff;border:3px solid #111;border-radius:14px;padding:8px 14px;font-size:20px;font-weight:900;line-height:1.5;text-wrap:balance;margin-bottom:10px}
.dp-q{font-size:19px;font-weight:900;line-height:1.7;color:#B91C1C;margin:8px 0;text-wrap:balance}
.dp-p{margin:10px 0 0;font-size:18px;line-height:1.95;font-weight:700;color:#111}
.pcs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pc{border:3px solid #111;border-radius:14px;background:#F3F4F6;text-align:center;padding:6px 2px 8px}
.pc.hl{background:#FACC15}
.pc i{display:block;font-style:normal;font-size:14px;font-weight:900;line-height:1.5;min-height:42px;color:#111;text-wrap:balance;padding:0 2px}
.pc b{display:block;font-size:38px;line-height:1.3;font-weight:900}
.tl{border:3px solid #111;border-radius:18px;padding:14px 16px;margin-top:10px;color:#fff}
.tl b{display:block;font-size:19px;font-weight:900;line-height:1.6}

];
const BR_META=[
  {h:"子",e:4},{h:"丑",e:2},{h:"寅",e:0},{h:"卯",e:0},{h:"辰",e:2},{h:"巳",e:1},
  {h:"午",e:1},{h:"未",e:2},{h:"申",e:3},{h:"酉",e:3},{h:"戌",e:2},{h:"亥",e:4}
];
const EL_COLOR=["#15803D","#DC2626","#D97706","#475569","#1D4ED8"];
const mod=(a,b)=>((a%b)+b)%b;
function jdn(y,m,d){
  const a=Math.floor((14-m)/12), yy=y+4800-a, mm=m+12*a-3;
  return d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045;
}
function pillars(y,m,d){
  const J=jdn(y,m,d);
  let ys=y; if(m<2||(m===2&&d<4)) ys=y-1;
  return {dayStem:mod(J+9,10),dayBranch:mod(J+1,12),yearStem:mod(ys-4,10),yearBranch:mod(ys-4,12)};
}
function compat(a,b){
  const A=STEM_META[a], B=STEM_META[b];
  if(a!==b && mod(a,5)===mod(b,5)) return {score:96,key:"heaven"};
  let s,key;
  if(A.e===B.e){s=78;key="mirror";}
  else if(B.e===mod(A.e+1,5)){s=86;key="nourish";}
  else if(A.e===mod(B.e+1,5)){s=90;key="nourished";}
  else if(B.e===mod(A.e+2,5)){s=70;key="challenge";}
  else {s=68;key="challenged";}
  if(A.p!==B.p) s+=4;
  return {score:Math.min(s,99),key};
}
/* ===== REPORT ENGINE (8 characters, luck cycles, analysis) ===== */
const D2R=Math.PI/180;
function sunLon(jd){
  const T=(jd-2451545.0)/36525;
  const L0=280.46646+36000.76983*T+0.0003032*T*T;
  const M=(357.52911+35999.05029*T-0.0001537*T*T)*D2R;
  const C=(1.914602-0.004817*T-0.000014*T*T)*Math.sin(M)+(0.019993-0.000101*T)*Math.sin(2*M)+0.000289*Math.sin(3*M);
  const om=(125.04-1934.136*T)*D2R;
  return mod(L0+C-0.00569-0.00478*Math.sin(om),360);
}
function jdAt(y,m,d,h){ return jdn(y,m,d)-0.5+(h-9)/24; }
function termJD(target,guess){
  let jd=guess;
  for(let i=0;i<10;i++){
    const diff=mod(target-sunLon(jd)+180,360)-180;
    jd+=diff/0.98565;
  }
  return jd;
}
function chart(y,m,d,hr){
  const h=hr<0?12:hr;
  const jd=jdAt(y,m,d,h), lon=sunLon(jd);
  let ys=y; if(m<=2 && lon>=200 && lon<315) ys=y-1;
  const J=jdn(y,m,d);
  const dayStem=mod(J+9,10), dayBranch=mod(J+1,12);
  const yearStem=mod(ys-4,10), yearBranch=mod(ys-4,12);
  const sec=Math.floor(mod(lon-315,360)/30);
  const monthBranch=mod(2+sec,12);
  const monthStem=mod(2*mod(yearStem,5)+2+sec,10);
  let hourStem=null,hourBranch=null;
  if(hr>=0){ hourBranch=Math.floor(((hr+1)%24)/2); hourStem=mod(2*mod(dayStem,5)+hourBranch,10); }
  return {yearStem,yearBranch,monthStem,monthBranch,dayStem,dayBranch,hourStem,hourBranch,jd,sec,hasHour:hr>=0};
}
/* relation of element e to day-master element dm: 0 peer,1 output,2 wealth,3 power,4 resource */
const relOf=(dm,e)=>mod(e-dm,5);
function analyze(c){
  const cnt=[0,0,0,0,0];
  const stems=[c.yearStem,c.monthStem,c.dayStem], brs=[c.yearBranch,c.monthBranch,c.dayBranch];
  if(c.hasHour){stems.push(c.hourStem);brs.push(c.hourBranch);}
  stems.forEach(s=>cnt[STEM_META[s].e]++);
  brs.forEach(b=>cnt[BR_META[b].e]++);
  const sc=cnt.slice(); sc[BR_META[c.monthBranch].e]++;
  const dm=STEM_META[c.dayStem].e;
  const total=sc.reduce((a,b)=>a+b,0);
  const strong=(sc[dm]+sc[mod(dm+4,5)])/total>=0.5;
  let dom=0,weak=0;
  for(let i=1;i<5;i++){ if(cnt[i]>cnt[dom]) dom=i; if(cnt[i]<cnt[weak]) weak=i; }
  const emo=cnt[1]+cnt[4]+0.5*cnt[0], rea=cnt[3]+cnt[2]+0.5*cnt[0];
  const emoPct=Math.round(emo/(emo+rea)*100);
  const fav=e=>{ const r=relOf(dm,e); if(r===0||r===4) return strong?-1:1; return strong?1:-1; };
  return {cnt,dm,strong,dom,weak,emoPct,fav,n:stems.length+brs.length};
}
function dayun(c,A,male){
  const yang=STEM_META[c.yearStem].p===1;
  const fwd=(male===false)?!yang:yang;
  const target=fwd?mod(315+30*(c.sec+1),360):mod(315+30*c.sec,360);
  const jdT=termJD(target,c.jd+(fwd?15:-15));
  const days=Math.abs(jdT-c.jd);
  const start=Math.max(1,Math.round(days/3));
  const per=[];
  const mk=(st,br,from,to,child)=>{
    const rel=relOf(A.dm,STEM_META[st].e);
    const fs=A.fav(STEM_META[st].e), fb=A.fav(BR_META[br].e);
    let score=50+(fs>0?18:-14)+(fb>0?12:-9)+[2,5,7,1,4][rel]+((st*7+br*3)%5);
    score=Math.max(25,Math.min(95,score));
    per.push({stem:st,branch:br,from,to,child:!!child,rel,fav:fs>0,score});
  };
  mk(c.monthStem,c.monthBranch,0,start-1,true);
  for(let k=1;k<=9;k++) mk(mod(c.monthStem+(fwd?k:-k),10),mod(c.monthBranch+(fwd?k:-k),12),start+10*(k-1),start+10*k-1,false);
  return {fwd,start,per};
}
function ageOn(y,m,d,now){
  now=now||new Date();
  let a=now.getFullYear()-y;
  if(now.getMonth()+1<m||(now.getMonth()+1===m&&now.getDate()<d)) a--;
  return Math.max(0,a);
}
function curIndex(D,age){
  for(let i=0;i<D.per.length;i++) if(age>=D.per[i].from&&age<=D.per[i].to) return i;
  return D.per.length-1;
}
/* ===== END ENGINE ===== */

 stems:[
  {n:"갑목(甲木)",t:"우뚝 선 큰 나무",tr:"곧고 야심 찬 타고난 리더예요. 목표를 향해 곧게 자라서 사람들이 당신의 힘에 기대지만, 굽히는 게 현명한 때에도 굽히기를 싫어해요.",lv:"의리 있고 지켜 주는 사랑을 해요. 당신이 원하는 방향으로 자라게 해 주는 사람에게 끌려요.",wk:"창업가, 리더, 빌더. 비전을 직접 쥘 때 가장 빛나요."},
  {n:"을목(乙木)",t:"들꽃과 덩굴",tr:"유연하고 매력 있고 조용히 강해요. 어떤 벽이든 돌아서 길을 찾고, 당신이 웃으면 사람들이 마음을 놓아요.",lv:"로맨틱하고 세심해요. 상대가 말하기 전에 기분부터 알아채요.",wk:"디자인, 사람을 만나는 일, 창의적인 일. 적응력으로 이겨요."},

const $=id=>document.getElementById(id);
const LANGS=["en","ko","ja","zh","es","fr"];
let lang="en", current=null, lastMatch=null;
const T=()=>I18N[lang];
const esc=s=>String(s).replace(/[<>&"]/g,"");

function detect(){
  try{
    const q=new URLSearchParams(location.search).get("lang");
    if(q && LANGS.includes(q)) return q;
  }catch(e){}
  try{
    const s=localStorage.getItem("sajupia_lang");
    if(s && LANGS.includes(s)) return s;
  }catch(e){}
  const n=(navigator.language||"en").toLowerCase();
  if(n.startsWith("ko")) return "ko";
  if(n.startsWith("ja")) return "ja";
  if(n.startsWith("es")) return "es";
  if(n.startsWith("fr")) return "fr";
  if(n.startsWith("zh") && /(tw|hk|mo|hant)/.test(n)) return "zh";
  return "en";
}
function applyStatic(){
  const t=T();
  document.documentElement.lang = lang==="zh" ? "zh-Hant" : lang; document.documentElement.setAttribute("translate","no");
  document.title=t.docTitle;
  document.querySelectorAll("[data-k]").forEach(el=>{ el.innerHTML=t[el.getAttribute("data-k")]; });
  $("name").placeholder=t.namePh;
  document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c.getAttribute("data-lang")===lang));
}
function setLang(l){
  lang=l;
  try{localStorage.setItem("sajupia_lang",l);}catch(e){}
  applyStatic();
  paintFormX();
  paintApps();
  if(current) paintResult();
  if(lastMatch) paintMatch();
}
function parseDate(v){
  if(!v) return null;
  const p=v.split("-").map(Number);
  if(p.length!==3||p.some(isNaN)) return null;
  const [y,m,d]=p;
  if(y<1900||y>2100) return null;
  return {y,m,d};
}

  '<text x="210" y="118" fill="#DC2626" stroke="#FACC15" stroke-width="5">占</text><text x="268" y="118" fill="#FACC15" stroke="#7F1D1D" stroke-width="6">堂</text></g>'+
  '<rect x="304" y="104" width="34" height="34" fill="#B91C1C" stroke="#FACC15" stroke-width="2.5"/><text x="321" y="130" text-anchor="middle" font-size="24" font-weight="900" fill="#FACC15" font-family=\''+F+'\'>符</text></svg>';
}
function paintApps(){
  const A=AX[lang]||AX.en, el=$("appsArea"); if(!el) return;
  const post=(cls,id,svg,t,s)=>'<a class="poster '+cls+'" id="'+id+'" href="#" role="button">'+svg+'<div class="pt"><div><b>'+t+'</b><small>'+s+'</small></div><span class="go">'+A.open+'</span></div></a>';
  const tb=$("talBanner"); if(tb){ tb.innerHTML='<a class="poster po-g" id="poBanner" href="#" role="button">'+svgGwang()+'<div class="pt"><div><b style="white-space:normal;font-size:21px">'+A.bt+'</b><small>'+A.bd+'</small></div><span class="go">'+A.open+'</span></div></a>';
    $("poBanner").addEventListener("click",e=>{e.preventDefault(); const u=APP_LINKS.gwang; if(u) window.open(u,"_blank","noopener"); }); }
  el.innerHTML='<h2>'+A.h+'</h2>'+post("po-m","poMunjo",svgMunjo(),A.m,A.ms)+post("po-g","poGwang",svgGwang(),A.g,A.gs)+'<div class="tip hidden" id="appToast" style="text-align:center">'+A.soon+'</div>';
  const tl=$("talisLink"); if(tl){ tl.innerHTML='<a class="tlink" id="tlGo" href="#" role="button"><span class="fu">符</span><b><span>'+A.t1+'</span><span>'+A.t2+'</span></b><span class="go">'+A.tb+'</span></a>';
    $("tlGo").addEventListener("click",e=>{ e.preventDefault(); const u=APP_LINKS.gwang; if(u) window.open(u,"_blank","noopener"); else { $("appToast").classList.remove("hidden"); $("appToast").scrollIntoView({block:"center",behavior:"smooth"}); } }); }
  [["poMunjo","munjo"],["poGwang","gwang"]].forEach(k=>{
    $(k[0]).addEventListener("click",e=>{ e.preventDefault(); const u=APP_LINKS[k[1]];
      if(u){ window.open(u,"_blank","noopener"); } else { $("appToast").classList.remove("hidden"); $("appToast").scrollIntoView({block:"center",behavior:"smooth"}); } });
  });
}
function paintResult(){
  const t=T(), c=current, P=c.P;
  const S=t.stems[P.dayStem], sm=STEM_META[P.dayStem];
  const elName=t.el[sm.e], col=EL_COLOR[sm.e];
  const nm=c.nm;
  const card=$("resCard");
  card.style.background="linear-gradient(160deg,"+col+",#111111)";
  card.innerHTML=
    '<div class="tag">'+t.tag+'</div>'+
    '<div class="big">'+sm.h+BR_META[P.dayBranch].h+'</div>'+
    '<h2>'+t.you(nm)+'<span class="nowrap">'+S.n+t.youSuf+'</span></h2>'+
    '<div class="sub">'+S.t+'</div>'+
    '<span class="pill">'+t.pillEl(elName)+'</span>'+
    '<span class="pill">'+t.pillYear(STEM_META[P.yearStem].e,P.yearBranch)+'</span>';

  const cnt=current.A.cnt, cmax=Math.max(3,...cnt);
  $("bars").innerHTML=t.el.map((n,i)=>
    '<div class="bar"><span style="color:'+EL_COLOR[i]+'">'+n+'</span><div class="track"><div class="fill" style="width:'+(cnt[i]/cmax*100)+'%;background:'+EL_COLOR[i]+'"></div></div><span>'+cnt[i]+'</span></div>'
  ).join("");
  const miss=t.el.filter((n,i)=>cnt[i]===0);
  $("missing").innerHTML = miss.length ? t.missing(miss.join(t.joiner)) : t.full;

  $("readTitle").textContent=t.readTitle(nm);
  $("rTrait").textContent=S.tr;
  $("rLove").textContent=S.lv;
  $("rWork").textContent=S.wk;
  paintDeep();
}
function reveal(){
  const dt=parseDate($("dob").value);
  if(!dt){ alert(T().needDob); return; }
  const hr=parseInt($("tm").value,10), gv=$("gn").value;
  const C=chart(dt.y,dt.m,dt.d,isNaN(hr)?-1:hr), A=analyze(C), D=dayun(C,A,gv==="f"?false:true);
  const P=pillars(dt.y,dt.m,dt.d); P.yearStem=C.yearStem; P.yearBranch=C.yearBranch;
  current={P,C,A,D,age:ageOn(dt.y,dt.m,dt.d),nm:esc(($("name").value||"").trim())};
  lastMatch=null;
  paintResult();
  $("matchOut").classList.add("hidden");
  $("formArea").classList.add("hidden");
  $("resultArea").classList.remove("hidden");
  $("resCard").scrollIntoView({behavior:"smooth",block:"start"});
}
function paintMatch(){
  const t=T(), r=lastMatch;
  $("mScore").textContent=r.score+"%";
  $("mMeter").style.width=r.score+"%";
  $("mTitle").innerHTML='<b>'+t.cmp[r.key].t+'</b><br>'+t.youL+': '+t.stems[current.P.dayStem].n+' · '+t.themL+': '+t.stems[r.stem].n;
  $("mText").textContent=t.cmp[r.key].x;
  $("matchOut").classList.remove("hidden");
}
function match(){
  const dt=parseDate($("dob2").value);
  if(!dt){ alert(T().needDob2); return; }
  const P2=pillars(dt.y,dt.m,dt.d);
  const r=compat(current.P.dayStem,P2.dayStem);
  lastMatch={score:r.score,key:r.key,stem:P2.dayStem};
  paintMatch();
}
function fit(x,txt,weight,px,maxW){
  let s=px;
  do{ x.font=weight+" "+s+"px "+FF(); s-=2; }while(x.measureText(txt).width>maxW && s>20);
}
const FF=()=>getComputedStyle(document.body).fontFamily||"sans-serif";
function drawCard(){
  const t=T(), P=current.P, sm=STEM_META[P.dayStem], S=t.stems[P.dayStem];
  const W=1080,H=1350,c=document.createElement("canvas");c.width=W;c.height=H;
  const x=c.getContext("2d");
  const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,EL_COLOR[sm.e]);g.addColorStop(1,"#111111");
  x.fillStyle=g;x.fillRect(0,0,W,H);
  x.textAlign="center";x.fillStyle="#FFFFFF";
  x.font="900 44px "+FF();x.fillText("SAJUPIA · K-SAJU",W/2,120);
  fit(x,t.cardTop,"900",70,960);x.fillText(t.cardTop,W/2,290);
  x.font="900 300px "+FF();x.fillText(sm.h+BR_META[P.dayBranch].h,W/2,620);
  fit(x,S.n,"900",92,960);x.fillText(S.n,W/2,780);
  fit(x,S.t,"800",66,960);x.fillText(S.t,W/2,880);
  x.fillRect(240,950,600,8);
  const l1=t.pillEl(t.el[sm.e]), l2=t.pillYear(STEM_META[P.yearStem].e,P.yearBranch);
  fit(x,l1,"800",54,960);x.fillText(l1,W/2,1045);
  fit(x,l2,"800",54,960);x.fillText(l2,W/2,1125);
  x.fillStyle="#F59E0B";
  fit(x,t.cardFoot,"900",52,960);x.fillText(t.cardFoot,W/2,1250);
  return c;
}
async function share(){
  const t=T(), msg=$("shareMsg"), sm=STEM_META[current.P.dayStem];
  const text=t.shareText(t.stems[current.P.dayStem].n,t.stems[current.P.dayStem].t,t.el[sm.e]);
  let url=location.href.split("#")[0];
  try{ const u=new URL(location.href); u.hash=""; u.searchParams.set("lang",lang); url=u.toString(); }catch(e){}
  try{await document.fonts.ready}catch(e){}
  const blob=await new Promise(r=>drawCard().toBlob(r,"image/png"));
  try{
    const f=blob?new File([blob],"sajupia.png",{type:"image/png"}):null;
    if(f && navigator.canShare && navigator.canShare({files:[f]})){
      await navigator.share({files:[f],text:text+" "+url}); return;
    }
    if(navigator.share){ await navigator.share({text:text,url:url}); return; }
  }catch(e){ if(e&&e.name==="AbortError") return; }
  try{ await navigator.clipboard.writeText(text+" "+url); msg.textContent=t.copied; }
  catch(e){ msg.textContent=t.copyFail; }
  msg.classList.remove("hidden");
}
document.querySelectorAll(".chip").forEach(b=>b.addEventListener("click",()=>setLang(b.getAttribute("data-lang"))));

$("matchBtn").addEventListener("click",match);
$("shareBtn").addEventListener("click",share);

});
