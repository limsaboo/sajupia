.stage>*{position:absolute}
.sign{left:17%;width:66%;top:2.6%;border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.7),0 0 26px rgba(255,180,80,.35)}
.rope{top:0;height:2.8%;width:.6%;background:#5a3418}.rope.l{left:24%}.rope.r{left:75.4%}
.glow{left:-6%;top:22%;width:30%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(255,200,110,.55),rgba(255,160,60,0) 65%);mix-blend-mode:screen;animation:flick 2.2s infinite}
@keyframes flick{0%,100%{opacity:.85;transform:scale(1)}40%{opacity:1;transform:scale(1.05)}60%{opacity:.75;transform:scale(.97)}}
.smoke{left:14.5%;top:50%;width:5%;height:6%;border-radius:50%;background:radial-gradient(circle,rgba(235,225,235,.42),rgba(235,225,235,0) 70%);filter:blur(3px);animation:rise 6s linear infinite;opacity:0}
.smoke.s2{animation-delay:2s}.smoke.s3{animation-delay:4s}
@keyframes rise{0%{transform:translate(0,0) scale(.6);opacity:0}15%{opacity:.8}100%{transform:translate(18px,-260px) scale(3.2);opacity:0}}
.fog{left:-20%;width:140%;bottom:-4%;height:26%;background:radial-gradient(ellipse at 30% 60%,rgba(230,215,235,.22),transparent 60%),radial-gradient(ellipse at 75% 70%,rgba(230,215,235,.18),transparent 60%);filter:blur(6px);animation:drift 12s ease-in-out infinite alternate;pointer-events:none;z-index:6}
@keyframes drift{from{transform:translateX(-5%)}to{transform:translateX(5%)}}
.cage{left:9%;width:34%;top:28.6%;z-index:2;filter:drop-shadow(0 8px 6px rgba(0,0,0,.6))}
.box{left:46%;width:50%;top:56.6%;z-index:3;filter:drop-shadow(0 8px 8px rgba(0,0,0,.65))}
.pop{width:6.6%;z-index:3;top:55%;opacity:0;transition:top .35s,opacity .2s}
.pop.up{top:52%;opacity:1}
#bird{width:16%;left:19%;top:47.8%;z-index:4;transition:left .5s ease-in-out,top .5s ease-in-out,width .5s;filter:drop-shadow(0 6px 4px rgba(0,0,0,.55))}
#bird.flip{transform:scaleX(-1)}
#bird.hop{animation:hop .5s ease-in-out}
#bird.flip.hop{animation:hopf .5s ease-in-out}
@keyframes hop{50%{transform:translateY(-38%)}}
@keyframes hopf{50%{transform:scaleX(-1) translateY(-38%)}}
#bird.peck{animation:peck .32s ease-in-out 2}
@keyframes peck{50%{transform:rotate(14deg) translateY(10%)}}
.cap{left:0;right:0;bottom:3.5%;text-align:center;font-size:15px;font-weight:900;color:#FFF3C4;text-shadow:0 2px 6px #000;z-index:7}
.res{inset:0;z-index:9;background:rgba(10,4,8,.62);display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .5s}

/* 光德道 부적 생성기 (캔버스) */
const TAL={seal:null,ready:null};
function talLoad(){return TAL.ready||(TAL.ready=new Promise(r=>{const i=new Image();i.onload=()=>{TAL.seal=i;r();};i.onerror=()=>r();i.src=SEAL_URL;}));}
function talSeed(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return()=>{h+=0x6D2B79F5;let t=Math.imul(h^h>>>15,1|h);t^=t+Math.imul(t^t>>>7,61|t);return((t^t>>>14)>>>0)/4294967296;};}
function talNum(n){const d='〇一二三四五六七八九';if(n<10)return d[n];if(n<20)return '十'+(n%10?d[n%10]:'');return d[Math.floor(n/10)]+'十'+(n%10?d[n%10]:'');}
function talDate(dt){dt=dt||new Date();const y=String(dt.getFullYear()).split('').map(c=>'〇一二三四五六七八九'[+c]).join('');return y+'年 '+talNum(dt.getMonth()+1)+'月 '+talNum(dt.getDate())+'日';}
async function drawTalisman(o){
  await talLoad();
  const W=760,H=1180,k=(o.width||520)/W;
  const c=document.createElement('canvas');c.width=Math.round(W*k);c.height=Math.round(H*k);
  const x=c.getContext('2d');x.scale(k,k);
  const rnd=talSeed((o.wish||'')+(o.name||'')+(o.sub||'')+'光德道');
  const SERIF='"Noto Serif KR","Noto Serif CJK KR","Nanum Myeongjo",serif';
  let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#F9DF72');g.addColorStop(.5,'#F3CD4A');g.addColorStop(1,'#EAB92F');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  for(let i=0;i<1500;i++){x.fillStyle='rgba(120,70,0,'+(rnd()*.07)+')';x.fillRect(rnd()*W,rnd()*H,rnd()*3+.5,rnd()*3+.5);}
  g=x.createRadialGradient(W/2,H/2,H*.25,W/2,H/2,H*.75);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(110,60,0,.35)');x.fillStyle=g;x.fillRect(0,0,W,H);
  const RED='#C1121F';x.strokeStyle=RED;x.fillStyle=RED;x.lineCap='round';x.lineJoin='round';
  x.lineWidth=12;x.strokeRect(26,26,W-52,H-52);x.lineWidth=3;x.strokeRect(46,46,W-92,H-92);
  x.textAlign='center';x.textBaseline='middle';
  x.font='900 78px '+SERIF;x.fillText('光德道',W/2,124);
  x.font='900 27px '+SERIF;x.fillText('天福  地福  人福  AI福',W/2,190);
  x.lineWidth=4;x.beginPath();x.moveTo(92,226);x.lineTo(W-92,226);x.stroke();
  x.lineWidth=2;x.beginPath();x.moveTo(92,236);x.lineTo(W-92,236);x.stroke();
  function glyph(cx,cy,s){const n=5+Math.floor(rnd()*3);x.lineWidth=5;
    for(let i=0;i<n;i++){const ax=cx+(rnd()-.5)*s,ay=cy+(rnd()-.5)*s,t=rnd();x.beginPath();x.moveTo(ax,ay);
      if(t<.3)x.lineTo(ax+(rnd()*.7+.3)*s,ay+(rnd()-.5)*8);
      else if(t<.6)x.lineTo(ax+(rnd()-.5)*8,ay+(rnd()*.7+.3)*s);
      else if(t<.8)x.lineTo(ax+(rnd()-.5)*s,ay+(rnd()-.2)*s);
      else x.quadraticCurveTo(ax+(rnd()-.5)*s,ay+(rnd()-.5)*s,ax+(rnd()-.5)*s,ay+(rnd()-.5)*s);
      x.stroke();}
    x.lineWidth=3;x.strokeRect(cx-s*.62,cy-s*.62,s*1.24,s*1.24);}
  for(let i=0;i<6;i++){glyph(96,296+i*82,46);glyph(W-96,296+i*82,46);}
  x.font='900 124px '+SERIF;x.lineWidth=2;
  ['所','願','成','就'].forEach((ch,i)=>{x.fillText(ch,W/2,310+i*132);x.strokeText(ch,W/2,310+i*132);});
  const wish=(o.wish||'소원이 이루어지다').replace(/\s+/g,'').slice(0,20);
  x.font='900 46px '+SERIF;
  const cols=[wish.slice(0,10),wish.slice(10,20)];
  cols.forEach((s,ci)=>{if(!s)return;[...s].forEach((ch,i)=>x.fillText(ch,ci?200:255,300+i*56));});
  const name=(o.name||'덕도').slice(0,5);
  x.font='900 26px '+SERIF;x.fillText('發願',484,292);
  x.font='900 44px '+SERIF;[...name].forEach((ch,i)=>x.fillText(ch,484,346+i*54));
  x.font='900 28px '+SERIF;[...talDate(o.date)].forEach((ch,i)=>{if(ch!==' ')x.fillText(ch,540,300+i*36);});
  if(o.sub){x.font='900 30px '+SERIF;[...o.sub].forEach((ch,i)=>x.fillText(ch,596,300+i*40));}
  const cx=300,cy=965;
  x.lineWidth=5;x.beginPath();x.arc(cx,cy,118,0,Math.PI*2);x.stroke();
  x.lineWidth=2;x.beginPath();x.arc(cx,cy,64,0,Math.PI*2);x.stroke();

    for(let b=0;b<3;b++){const r=72+b*14;x.lineWidth=7;

function dstr(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function usedToday(){try{return localStorage.getItem('yh_bird_day')===dstr();}catch(e){return false;}}
function markUsed(){try{localStorage.setItem('yh_bird_day',dstr());}catch(e){}}
function toast(m){const e=document.getElementById('toast');e.textContent=m;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600);}

"일·시험":"꼼꼼함이 점수를 가르는 날이에요. 보내기 전 확인, 제출 전 재검토, 시험이라면 답안지 밀려쓰기 확인이 중요해요. 아는 문제를 실수로 놓치지 않는 것이 합격선이에요.",
"건강·마음":"몸이 보내는 작은 신호에 귀 기울이는 날이에요. 어깨와 목이 뻐근하거나 눈이 피로할 수 있으니 자주 쉬어 주세요. 마음이 예민하다면 큰 결정은 접어 두세요.",
"소원":"소원의 싹이 아직 땅속에 있는 때예요. 지금은 물과 햇빛을 주는 시기, 곧 준비 단계예요. 서두르지 않으면 계절이 바뀔 때 결실이 보여요."},
"말길":{
"오늘 운세":"쉬어 가라는 신호의 날이에요. 무리하면 에너지만 새니, 해야 할 일의 우선순위를 줄이고 꼭 필요한 것만 하세요. 이런 날 푹 쉬면 다음 날 훨씬 가볍게 일어나요.",
"연애·인연":"인연도 쉬어 가는 날이에요. 상대의 마음을 확인하려 하거나 서운함을 따지기엔 좋지 않아요. 오늘은 나를 돌보는 데 쓰고, 연락은 내일로 미루세요.",
"재물·돈":"지키는 것이 버는 것인 날이에요. 큰 지출, 계약, 투자는 미루고 통장 잔액을 확인하며 마음을 안정시키세요. 오늘 참은 소비가 다음에 더 좋은 기회로 돌아와요.",
"일·시험":"판단이 흐려지기 쉬운 날이에요. 중요한 결정과 서명은 하루 미루세요. 시험이라면 새로운 걸 보기보다 아는 것을 가볍게 훑으며 컨디션을 지키는 쪽이 나아요.",
"건강·마음":"몸과 마음이 충전을 필요로 하는 날이에요. 일찍 잠자리에 들고 카페인과 야식은 줄여 보세요. 마음이 복잡하면 생각을 종이에 적어 비우면 한결 가벼워져요.",
"소원":"소원은 잠시 마음속에 접어 두는 날이에요. 지금 조급하면 오히려 멀어져요. 겨울을 지나야 봄이 오듯, 쉬는 시간이 소원을 키우는 거름이 돼요."}};
const FLOW={
"대길":["좋은 소식이나 반가운 연락이 먼저 찾아와요","사람 만나는 일, 부탁하는 일이 술술 풀려요","오늘 좋았던 일을 되새기며 감사 한마디를 전하세요"],
"길":["차분히 오늘의 계획을 세우면 좋아요","협의, 약속, 도움 요청이 순조로워요","가벼운 산책으로 하루를 마무리하세요"],
"중길":["평소의 루틴을 그대로 지키세요","무리하지 말고 한 가지씩 끝내세요","내일 할 일을 적어 두고 일찍 쉬세요"],
"소길":["서두르면 실수가 생기니 천천히 시작하세요","확인과 점검에 집중하고 말은 한 번 더 생각하세요","조용히 혼자만의 시간을 가지세요"],
"말길":["컨디션을 살피며 가볍게 시작하세요","중요한 결정과 약속은 뒤로 미루세요","일찍 불을 끄고 푹 쉬세요"]};
const DO={
"오늘 운세":["아침에 창문을 열고 3분 동안 환기하기","오늘 가장 중요한 일 한 가지를 종이에 적기","마주치는 사람에게 먼저 인사하기","저녁에 오늘 좋았던 일 한 가지 떠올리기"],
"연애·인연":["먼저 짧은 안부 메시지 보내기","상대 이야기를 끝까지 듣고 '그랬구나' 한마디 해 주기","옷차림을 단정히 하고 거울 보며 미소 짓기","작은 간식이나 따뜻한 커피로 마음 표현하기"],
"재물·돈":["통장과 카드 내역을 5분만 훑어보기","정리할 구독 서비스 하나 확인하기","오늘 쓸 돈의 한도를 미리 정해 두기","들어온 돈의 일부를 바로 저축하기"],
"일·시험":["오늘 할 일을 3가지만 우선순위로 적기","제출하기 전에 소리 내어 한 번 읽어 보기","모르는 부분 하나를 사람에게 물어보기","시작하기 전에 책상을 3분 정리하기"],
"건강·마음":["물 한 컵 마시고 어깨를 크게 돌리기","10분 걷기, 햇빛 쬐기","잠들기 전 30분은 휴대폰 보지 않기","걱정거리를 종이에 적어 접어 두기"],
"소원":["소원을 한 문장으로 또렷하게 적기","소원을 위해 오늘 할 첫 행동 하나 정하기","믿는 사람에게 내 소원을 이야기하기","아래에서 소원 부적을 만들어 잘 보이는 곳에 붙이기"]};
const CARE={
"대길":["기분이 좋다고 약속을 너무 많이 하지 마세요.","자랑이 지나치면 복이 줄어요. 겸손을 지키세요.","좋은 운에 취해 큰돈을 충동적으로 쓰지 마세요."],
"길":["조급하게 결론을 서두르지 마세요.","남과 비교하면 오늘의 복이 작아 보여요.","말이 앞서면 실수해요. 한 번 더 생각하고 말하세요."],
"중길":["무난하다고 방심하면 사소한 일을 놓쳐요.","미루는 습관이 복을 가려요.","쓸데없는 걱정을 키우지 마세요."],
"소길":["서두르면 실수가 따라와요.","충동적인 선택과 감정적인 말은 피하세요.","남의 부탁을 덥석 받으면 짐이 돼요."],
"말길":["무리한 일정은 오늘만큼은 접으세요.","화가 날 때 바로 답장하지 마세요.","중요한 서명과 큰 결정은 오늘 하지 마세요."]};
const CLOSE={
"대길":"오늘의 복은 나눌수록 커져요. 좋은 기운을 가까운 사람에게도 전해 보세요.",
"길":"한 걸음씩 가면 반드시 닿아요. 문조가 응원하고 있어요.",
"중길":"평범한 하루가 쌓여 큰 복이 돼요. 오늘도 수고했어요.",
"소길":"천천히 가는 걸음이 가장 멀리 가요. 내일은 문조가 더 좋은 말을 물어 올 거예요.",
"말길":"쉬어 가는 날도 길의 일부예요. 푹 쉬고 내일 다시 물어보세요."};
const COLORS=["금색","분홍","하늘색","초록","보라","주황","흰색","빨강"];
const DIRS=["동쪽","서쪽","남쪽","북쪽","동남쪽","서남쪽"];
const TIMES=["이른 아침","오전","점심 무렵","오후","해 질 녘","저녁"];

const $=id=>document.getElementById(id),wait=ms=>new Promise(r=>setTimeout(r,ms));
function rnd(n){try{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n;}catch(e){return Math.floor(Math.random()*n);}}
let Q="오늘 운세",busy=false;
$("q").onclick=e=>{const b=e.target.closest("button");if(!b||busy)return;[...$("q").children].forEach(x=>x.classList.remove("on"));b.classList.add("on");Q=b.dataset.q;};
const bird=$("bird");
async function move(l,t,{img,flip,w}={}){if(img)bird.src=IMG[img];bird.classList.toggle("flip",!!flip);if(w)bird.style.width=w+"%";
  bird.classList.remove("hop");void bird.offsetWidth;bird.classList.add("hop");bird.style.left=l+"%";bird.style.top=t+"%";await wait(520);bird.classList.remove("hop");}
function reset(){bird.src=IMG.b4;bird.classList.remove("flip");bird.style.width="16%";bird.style.left="19%";bird.style.top="47.8%";$("cage").src=IMG.c0;$("cage").style.left="9%";$("cage").style.width="34%";$("pop").className="pop";}
async function run(){
  if(busy)return;if(!TEST&&usedToday()){document.getElementById("gate").classList.add("on");return;}busy=true;$("go").disabled=true;$("card").style.display="none";$("res").classList.remove("show");reset();await wait(80);
  const cap=$("cap");
  cap.textContent="새장 문이 열려요…";const cg=$("cage");cg.src=IMG.c1;cg.style.left="5%";cg.style.width="38%";await wait(650);
  cap.textContent="문조가 나와요";
  await move(31,52.5,{img:"b5"});await move(38,52.5,{img:"b4"});
  cap.textContent="어느 점괘를 고를까…";
  const xs=[48,56,64,72,80];
  for(let k=0;k<3;k++){await move(xs[rnd(5)]-4,51.4,{img:"b5"});bird.src=IMG.b4;await wait(260);}
  const px=[51.5,57.2,62.9,68.6,74.3,80,85.7,91.4][rnd(8)];
  await move(px-12,51.4,{img:"b5"});bird.src=IMG.b4;await wait(200);
  bird.classList.add("peck");cap.textContent="콕! 이걸로 정했어요";
  const pop=$("pop");pop.style.left=(px-3.3)+"%";pop.classList.add("up");await wait(700);bird.classList.remove("peck");
  pop.className="pop";bird.src=IMG.b6;await wait(250);
  cap.textContent="점괘를 물고 와요";
  await move(30,64,{img:"b6",flip:true,w:20});await wait(250);
  cap.textContent="";show();
  busy=false;$("go").disabled=false;$("go").textContent="🐦 한 번 더 물어보기";
}
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
function show(){
  const i=rnd(SL.length),s=SL[i],g=s[0];
  $("ptxt").innerHTML='<div class="no">'+Q+' · 제 '+(i+1)+' 괘</div><div class="gr" style="color:'+GC[g]+'">'+g+'</div><div class="poem">'+s[1]+'</div>';
  $("res").classList.add("show");
  const f=FLOW[g],tips=shuf(DO[Q]).slice(0,2),care=shuf(CARE[g])[0];
  $("card").innerHTML=
   '<div class="sec"><div class="h c1">🐦 새가 전하는 말</div><p>'+s[2]+'</p></div>'+
   '<div class="sec"><div class="h c2">💬 '+Q+' 자세히 풀어드려요</div><p>'+QX[g][Q]+'</p></div>'+
   '<div class="sec"><div class="h c3">🕐 오늘의 흐름</div>'+
     '<div class="row r1"><b>아침</b><span>'+f[0]+'</span></div><div class="row r2"><b>낮</b><span>'+f[1]+'</span></div><div class="row r3"><b>저녁</b><span>'+f[2]+'</span></div></div>'+
   '<div class="sec"><div class="h c4">✅ 이렇게 해 보세요</div>'+
     '<div class="li"><b>1</b><span>'+tips[0]+'</span></div><div class="li"><b>2</b><span>'+tips[1]+'</span></div></div>'+
   '<div class="sec"><div class="h c5">⚠️ 이것만은 조심하세요</div><p>'+care+'</p></div>'+
   '<div class="luck"><div>행운의 숫자<span>'+(rnd(9)+1)+'</span></div><div>행운의 색<span>'+COLORS[rnd(COLORS.length)]+'</span></div><div>좋은 방향<span>'+DIRS[rnd(DIRS.length)]+'</span></div><div>좋은 시간<span>'+TIMES[rnd(TIMES.length)]+'</span></div></div>'+
   '<p class="close">'+CLOSE[g]+'</p>'+
   '<div class="sec" style="border-top:2px dashed #E8C77A;padding-top:16px;margin-top:14px"><div class="h" style="color:#B4231F">🧧 내 소원 부적 만들기</div><p>소원을 한 줄 적으면 광덕도 부적으로 만들어 드려요.</p><input id="cw" maxlength="20" placeholder="소원 한 줄 (20자 이내)"><input id="cn" maxlength="5" placeholder="이름 (선택, 5자 이내)"><button class="mk" data-act="charm" type="button">🧧 부적 만들기</button><div class="cout" id="cout"></div></div>'+
   '<div class="deep"><div class="dt">🔮 더 깊은 풀이는<br>광덕도 정밀 풀이에서</div><button class="mk" data-act="deep" type="button">정밀 풀이 신청하기</button></div>'+
   '<button class="other" data-act="other" type="button">다른 질문 고르기</button>';
  window.LAST={no:i+1,g:g};markUsed();
  try{localStorage.setItem('yh_bird_card',JSON.stringify({d:dstr(),html:$("card").innerHTML,no:i+1,g:g,q:Q}));}catch(e){}
  $("card").style.display="block";
  
}
$("see").onclick=e=>{e.stopPropagation();$("res").classList.remove("show");reset();$("cap").textContent="문조가 새장 안에서 기다려요";setTimeout(()=>$("card").scrollIntoView({behavior:"smooth",block:"start"}),120);};
$("res").onclick=()=>{$("res").classList.remove("show");reset();$("cap").textContent="문조가 새장 안에서 기다려요";};
$("go").onclick=run;
$("card").addEventListener("click",async e=>{const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;
  if(a==="other"){$("q").scrollIntoView({behavior:"smooth",block:"center"});}
  if(a==="deep"){const L=window.LAST||{};copyOpen("[광덕도 정밀 풀이 신청]\n질문: "+Q+"\n오늘의 점괘: 제 "+(L.no||"-")+" 괘 "+(L.g||"")+"\n이름:\n생년월일(양력):\n성별:\n궁금한 점:","신청서를 복사했어요. 오픈채팅에 붙여넣기 하세요");}
  if(a==="charm"){const w=$("cw").value.trim(),n=$("cn").value.trim();if(!w){toast("소원을 한 줄 적어 주세요");return;}
    b.disabled=true;b.textContent="부적을 쓰는 중…";const c=await drawTalisman({wish:w,name:n||"덕도",sub:"所願祈願",width:520});const u=c.toDataURL("image/jpeg",.9);
    $("cout").innerHTML='<img src="'+u+'" alt="소원 부적"><p>이미지를 길게 누르면 저장돼요</p><a href="'+u+'" download="광덕도-소원부적.jpg" style="display:inline-block;margin-top:6px;font-weight:900;color:#1D4ED8;font-size:16px">📥 사진으로 저장하기</a>';
    b.disabled=false;b.textContent="🧧 다시 만들기";}
});
$("gReg").onclick=()=>{copyOpen("[광덕도 덕도님 사전 등록]\n이름(또는 별칭):\n연락처(카톡/전화):\n궁금한 점:","등록 양식을 복사했어요. 오픈채팅에 붙여넣기 하세요");};
$("gClose").onclick=()=>$("gate").classList.remove("on");
(function(){try{const j=JSON.parse(localStorage.getItem('yh_bird_card')||'null');if(j&&j.d===dstr()){$("card").innerHTML=j.html;$("card").style.display="block";window.LAST={no:j.no,g:j.g};Q=j.q||Q;$("go").textContent=TEST?"🐦 한 번 더 물어보기":"🐦 오늘의 새점 완료 · 내일 또 만나요";}}catch(e){}})();

</script>
